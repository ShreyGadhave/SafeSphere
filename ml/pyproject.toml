[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safesphere-ml"
version = "0.1.0"
description = "SafeSphere model training: risk, routing, audio, motion, anomaly, NLP, triage"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "notebooks"]
